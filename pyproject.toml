[build-system]
requires = ["hatchling>=1.14.1"]
build-backend = "hatchling.build"

[project]
name = "py_s3_storacha"
dynamic = ["version"]
authors = [
  { name="Emmanuel Akanji", email="omoebun52@gmail.com" },
  { name="Emmanuel Appah", email="climaxating@gmail.com" },
  { name="Collins Abegunde", email="itszroth@gmail.com" },
]
description = "A tool for migrating objects from AWS S3 to Storacha"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "httpx",
    "aioboto3"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "python-dotenv",
    "boto3",
    "ruff",
    "pyright"
]

[project.urls]
Homepage = "https://github.com/Mahd-Mehn/MM-python-s3-storacha"
Issues = "https://github.com/Mahd-Mehn/MM-python-s3-storacha/issues"

[project.scripts]
py-s3-storacha = "py_s3_storacha.cli:main"
py-s3-storacha-setup = "py_s3_storacha.setup_helpers:main"
py-s3-storacha-auth = "py_s3_storacha.auth_helper:main"

[tool.hatch.version]
path = "src/py_s3_storacha/__init__.py"

[tool.hatch.build]
packages = ["src/py_s3_storacha"]
include = [
    "src/py_s3_storacha/py.typed",
    "src/py_s3_storacha/js/**/*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/py_s3_storacha"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
